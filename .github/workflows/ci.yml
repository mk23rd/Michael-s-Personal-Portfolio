name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

      # Serves dist/ with `vite preview` (which replays public/_headers, so the CSP is enforced)
      # and drives the runner's preinstalled Chrome through the whole site: headers, screenshots
      # in both themes, axe-core, interactions, mobile menu, reduced motion, 404, boot, palette.
      - run: npm run test:smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: test-results/smoke
          retention-days: 14
