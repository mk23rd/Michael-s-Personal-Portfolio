name: Labeler

# pull_request_target so PRs from forks can be labelled too. The workflow never checks out
# or runs PR code; it only reads the changed file list and applies labels.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    name: Label pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: false
